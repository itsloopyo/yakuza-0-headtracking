[workspace]
name = "yakuza-0-headtracking"
version = "0.0.0"
description = "Head tracking mod for Yakuza 0 using CameraUnlock shared library"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
sync = { cmd = "git submodule update --remote cameraunlock-core" }

# No -G: let CMake auto-detect the installed Visual Studio generator. Pinning
# "Visual Studio 17 2022" broke on CI once the windows runner image moved to
# VS 2026 (VS 17 absent); auto-detect picks whatever VS the machine has.
setup = { cmd = """
    powershell -Command "if (-not (Test-Path 'build')) { cmake -B build -A x64 } else { Write-Host 'Build directory exists, skipping setup' -ForegroundColor Yellow }"
""" }

build = { cmd = "cmake --build build --config Release", depends-on = ["setup"] }

# test-unit: the view math and the config tests. test-differential: the config
# differential test, which holds the frozen Yakuza0HeadTracking.ini reader to the
# dev build's and the migration into CameraUnlock.ini to that reader, and core's
# canonical config lint over every file that test migrated (run with node).
# Needs no game install.
test-unit = { cmd = "ctest --test-dir build -C Release --output-on-failure -LE differential", depends-on = ["build"] }
test-differential = { cmd = "ctest --test-dir build -C Release --output-on-failure --no-tests=error -L differential", depends-on = ["build"] }
test = { depends-on = ["test-unit", "test-differential"] }

# Rewrites CameraUnlock.ini, the committed config, from the config table after a
# change to a row, a comment or a default, then the launcher manifest's config
# descriptor per_game from it. yakuza0_config_tests fails until it has run.
render-config = { cmd = "build/tests/Release/yakuza0_config_tests.exe --render-config CameraUnlock.ini && node cameraunlock-core/scripts/encode-seed.mjs", depends-on = ["build"] }

clean = { cmd = """
    powershell -Command "if (Test-Path 'build') { Remove-Item 'build' -Recurse -Force }; if (Test-Path 'bin') { Remove-Item 'bin' -Recurse -Force }; Write-Host 'Build artifacts cleaned' -ForegroundColor Green"
""" }

update-deps = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1" }

package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["test-unit"] }

# Checks the newest release/*-installer.zip's launcher-manifest.json against the
# files in the ZIP, and that neither ZIP carries CameraUnlock.ini or
# Yakuza0HeadTracking.ini. Run it after package.
validate-manifest = "node cameraunlock-core/scripts/validate-manifest.mjs"

install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1", depends-on = ["build"] }
uninstall = "scripts\\uninstall.cmd /y"

release = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1" }

[dependencies]
# CMake 4.1 is the first release that knows the "Visual Studio 18 2026"
# generator. The windows runner image ships VS 18 only, so CMake 3.x finds no
# VS at all and silently falls back to NMake Makefiles, which then fails on
# the -A x64 platform argument.
cmake = ">=4.4.1,<4.4.2"
# Runs the canonical config lint in `test`, render-config's encode-seed step,
# validate-manifest and core's config descriptor check in packaging
# (Copy-SharedBundle). Pinned to the release core's own lock resolves.
nodejs = "==26.5.0"
